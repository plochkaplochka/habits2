<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Трекер привычек</title>
<meta name="description" content="Отслеживай привычки, не разрывай стрик">
<meta name="theme-color" content="#0f1117">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔥</text></svg>">
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --card-hover: #222633;
  --accent: #6c5ce7;
  --accent-2: #a29bfe;
  --success: #00b894;
  --danger: #ff6b6b;
  --text: #e8eaf0;
  --muted: #8b90a0;
  --border: #2a2e3d;
  --nav-height: 68px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 24px 16px calc(var(--nav-height) + 24px);
  background-image: radial-gradient(circle at 20% 0%, rgba(108,92,231,0.15), transparent 50%);
  -webkit-tap-highlight-color: transparent;
}

.container { max-width: 720px; margin: 0 auto; }

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}

h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; }

.date-badge {
  color: var(--muted);
  font-size: 14px;
  background: var(--card);
  padding: 6px 14px;
  border-radius: 20px;
  border: 1px solid var(--border);
}

.tab-panel { display: none; animation: fadeIn 0.25s ease; }
.tab-panel.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--nav-height);
  background: rgba(20, 23, 32, 0.85);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  z-index: 100;
  padding: 8px 16px;
  padding-bottom: max(8px, env(safe-area-inset-bottom));
}

.nav-btn {
  flex: 1;
  max-width: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 8px 12px;
  background: transparent;
  border: none;
  border-radius: 12px;
  color: var(--muted);
  cursor: pointer;
  font-family: inherit;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.3px;
  transition: all 0.2s;
  position: relative;
}

.nav-btn:hover { color: var(--text); background: rgba(255,255,255,0.03); }

.nav-btn.active {
  color: var(--accent-2);
  background: rgba(108,92,231,0.12);
}

.nav-btn.active::before {
  content: '';
  position: absolute;
  top: -8px;
  left: 50%;
  transform: translateX(-50%);
  width: 24px;
  height: 3px;
  background: var(--accent-2);
  border-radius: 0 0 4px 4px;
  box-shadow: 0 0 12px var(--accent);
}

.nav-icon {
  font-size: 22px;
  line-height: 1;
  transition: transform 0.2s;
}

.nav-btn.active .nav-icon { transform: scale(1.1); }

.global-streak {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 22px;
  margin-bottom: 20px;
  display: flex;
  align-items: center;
  gap: 22px;
  position: relative;
  overflow: hidden;
  transition: all 0.4s ease;
}

.global-streak::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 50%, rgba(255,159,67,0.18), transparent 60%);
  opacity: 0;
  transition: opacity 0.4s;
  pointer-events: none;
}

.global-streak.active {
  border-color: rgba(255,159,67,0.45);
  box-shadow: 0 0 40px rgba(255,159,67,0.12), inset 0 1px 0 rgba(255,255,255,0.04);
}

.global-streak.active::before { opacity: 1; }

.global-streak.at-risk { border-color: rgba(255,107,107,0.4); }

.global-streak.at-risk::before {
  background: radial-gradient(circle at 20% 50%, rgba(255,107,107,0.15), transparent 60%);
  opacity: 1;
}

.gs-flame {
  font-size: 62px;
  line-height: 1;
  filter: grayscale(1) opacity(0.35);
  transition: filter 0.4s, transform 0.4s;
  position: relative;
  z-index: 1;
  flex-shrink: 0;
}

.global-streak.active .gs-flame {
  filter: none;
  animation: bigFlicker 2.2s ease-in-out infinite;
}

@keyframes bigFlicker {
  0%, 100% { transform: scale(1) rotate(-2deg); }
  50% { transform: scale(1.1) rotate(2deg); }
}

.gs-info { flex: 1; position: relative; z-index: 1; min-width: 0; }

.gs-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 4px;
}

.gs-number {
  font-size: 44px;
  font-weight: 800;
  line-height: 1;
  letter-spacing: -1.5px;
  color: var(--muted);
  transition: color 0.4s;
}

.global-streak.active .gs-number {
  color: #ff9f43;
  text-shadow: 0 0 30px rgba(255,159,67,0.4);
}

.gs-unit { font-size: 16px; font-weight: 600; color: var(--muted); margin-left: 6px; }

.gs-status {
  font-size: 13px;
  color: var(--muted);
  margin-top: 8px;
  line-height: 1.5;
}

.gs-status.warn { color: #ffb84d; }

.gs-best {
  position: absolute;
  top: 16px;
  right: 18px;
  font-size: 11px;
  color: var(--muted);
  background: rgba(255,255,255,0.04);
  padding: 4px 10px;
  border-radius: 20px;
  border: 1px solid var(--border);
  z-index: 1;
}

/* === Статистика === */
.stats-section {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 20px;
  margin-bottom: 20px;
}

.stats-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 10px;
}

.stats-title {
  font-size: 15px;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 8px;
}

.stats-period {
  display: flex;
  gap: 4px;
  background: rgba(255,255,255,0.04);
  border-radius: 10px;
  padding: 3px;
  border: 1px solid var(--border);
}

.stats-period button {
  background: transparent;
  border: none;
  color: var(--muted);
  font-size: 12px;
  font-weight: 600;
  padding: 5px 12px;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}

.stats-period button:hover { color: var(--text); }

.stats-period button.active {
  background: var(--accent);
  color: white;
}

.stat-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
  margin-bottom: 18px;
}

.stat-card {
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 12px;
  transition: all 0.2s;
  text-align: center;
}

.stat-card:hover {
  background: rgba(255,255,255,0.05);
  border-color: rgba(108,92,231,0.4);
}

.stat-value {
  font-size: 24px;
  font-weight: 800;
  line-height: 1.1;
  letter-spacing: -0.5px;
  color: var(--text);
  margin-bottom: 4px;
}

.stat-value.accent { color: var(--accent-2); }
.stat-value.success { color: var(--success); }
.stat-value.warn { color: #ffb84d; }

.stat-label {
  font-size: 10px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  font-weight: 600;
}

.week-chart { margin-bottom: 18px; }

.week-chart-title {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin-bottom: 12px;
}

.week-bars {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  align-items: end;
  height: 90px;
  margin-bottom: 6px;
}

.week-bar-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  height: 100%;
  justify-content: flex-end;
  position: relative;
}

.week-bar {
  width: 100%;
  background: linear-gradient(180deg, var(--accent-2), var(--accent));
  border-radius: 6px 6px 3px 3px;
  min-height: 3px;
  transition: height 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.week-bar.best {
  background: linear-gradient(180deg, #ffb84d, #ff9f43);
  box-shadow: 0 0 15px rgba(255,159,67,0.4);
}

.week-bar-value {
  position: absolute;
  top: -16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 10px;
  font-weight: 700;
  color: var(--muted);
  white-space: nowrap;
}

.week-bar.best .week-bar-value { color: #ff9f43; }

.week-labels {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  font-size: 11px;
  color: var(--muted);
  text-align: center;
  font-weight: 600;
}

.per-habit {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.per-habit-title {
  font-size: 12px;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.8px;
  font-weight: 600;
  margin-bottom: 4px;
}

.ph-row {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.ph-head {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  gap: 10px;
}

.ph-name {
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}

.ph-value {
  color: var(--muted);
  font-weight: 600;
  font-size: 12px;
  flex-shrink: 0;
}

.ph-bar {
  height: 6px;
  background: rgba(255,255,255,0.06);
  border-radius: 3px;
  overflow: hidden;
}

.ph-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  border-radius: 3px;
  width: 0%;
  transition: width 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.ph-fill.low { background: linear-gradient(90deg, #ff6b6b, #ffb84d); }
.ph-fill.mid { background: linear-gradient(90deg, #ffb84d, #6c5ce7); }

.stats-empty {
  text-align: center;
  padding: 24px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}

/* === Форма === */
.add-form {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.add-form-row {
  display: flex;
  gap: 10px;
}

.add-form input[type="text"] {
  flex: 1;
  background: rgba(255,255,255,0.03);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  color: var(--text);
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
  font-family: inherit;
}

.add-form input[type="text"]:focus { border-color: var(--accent); }
.add-form input[type="text"]::placeholder { color: var(--muted); }

.add-form button[type="submit"] {
  background: var(--accent);
  border: none;
  border-radius: 12px;
  padding: 0 24px;
  color: white;
  font-size: 26px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.2s, transform 0.1s;
  min-width: 64px;
}

.add-form button[type="submit"]:hover { background: var(--accent-2); }
.add-form button[type="submit"]:active { transform: scale(0.96); }

/* ===== БОЛЬШОЙ ПЕРЕКЛЮЧАТЕЛЬ СЧЁТЧИКА ===== */
.counter-toggle-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 16px;
  background: rgba(255,255,255,0.02);
  border: 1px solid var(--border);
  border-radius: 14px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}

.counter-toggle-row:hover {
  background: rgba(108,92,231,0.06);
  border-color: rgba(108,92,231,0.4);
}

.counter-toggle-row.active {
  background: rgba(108,92,231,0.1);
  border-color: var(--accent);
}

/* Скрываем настоящий чекбокс, но оставляем его в DOM для доступности */
.counter-toggle-row input[type="checkbox"] {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}

/* Кастомный большой чекбокс */
.toggle-box {
  flex-shrink: 0;
  width: 32px;
  height: 32px;
  border-radius: 10px;
  border: 2px solid var(--border);
  background: rgba(255,255,255,0.03);
  display: flex;
  align-items: center;
  justify-content: center;
  color: transparent;
  font-size: 22px;
  font-weight: 900;
  line-height: 1;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.counter-toggle-row.active .toggle-box {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
  transform: scale(1.05);
  box-shadow: 0 0 20px rgba(108,92,231,0.5);
}

.toggle-text {
  flex: 1;
  min-width: 0;
}

.toggle-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
  transition: color 0.2s;
}

.counter-toggle-row.active .toggle-title {
  color: var(--accent-2);
}

.toggle-sub {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.4;
}

/* ===== БОЛЬШОЙ ВВОД ЦЕЛИ ===== */
.goal-block {
  display: none;
  flex-direction: column;
  gap: 12px;
  padding: 16px;
  background: rgba(108,92,231,0.06);
  border: 1px solid rgba(108,92,231,0.3);
  border-radius: 14px;
  animation: goalSlide 0.25s ease;
}

.goal-block.active { display: flex; }

@keyframes goalSlide {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.goal-label {
  font-size: 13px;
  color: var(--muted);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.goal-input-row {
  display: flex;
  align-items: stretch;
  gap: 10px;
}

.goal-stepper {
  display: flex;
  align-items: center;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
  flex: 1;
  transition: border-color 0.2s;
}

.goal-stepper:focus-within { border-color: var(--accent); }

.goal-stepper button {
  width: 56px;
  height: 60px;
  border: none;
  background: transparent;
  color: var(--text);
  font-size: 26px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  user-select: none;
}

.goal-stepper button:hover:not(:disabled) {
  background: rgba(108,92,231,0.15);
  color: var(--accent-2);
}

.goal-stepper button:active:not(:disabled) { transform: scale(0.92); }
.goal-stepper button:disabled { opacity: 0.25; cursor: not-allowed; }

.goal-stepper input[type="number"] {
  flex: 1;
  min-width: 0;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 28px;
  font-weight: 800;
  text-align: center;
  outline: none;
  font-family: inherit;
  letter-spacing: -1px;
  padding: 0 8px;
  -moz-appearance: textfield;
}

.goal-stepper input[type="number"]::-webkit-outer-spin-button,
.goal-stepper input[type="number"]::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

.goal-unit {
  display: flex;
  align-items: center;
  padding: 0 20px;
  background: rgba(255,255,255,0.03);
  border: 2px solid var(--border);
  border-radius: 14px;
  color: var(--muted);
  font-size: 15px;
  font-weight: 600;
  white-space: nowrap;
}

/* Быстрые пресеты */
.goal-presets {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}

.goal-presets button {
  flex: 1;
  min-width: 60px;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.15s;
  font-family: inherit;
  user-select: none;
}

.goal-presets button:hover {
  background: rgba(108,92,231,0.12);
  border-color: var(--accent);
  color: var(--text);
}

.goal-presets button.active {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

/* Прогресс дня */
.day-progress {
  margin-bottom: 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 14px 18px;
}

.progress-head {
  display: flex;
  justify-content: space-between;
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 8px;
}

.progress-bar {
  height: 8px;
  background: rgba(255,255,255,0.06);
  border-radius: 4px;
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--success));
  border-radius: 4px;
  width: 0%;
  transition: width 0.4s ease;
}

/* === Список привычек === */
.habits { display: flex; flex-direction: column; gap: 12px; }

.habit {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  transition: transform 0.15s, border-color 0.2s, background 0.2s;
  animation: slideIn 0.3s ease;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: translateY(0); }
}

.habit:hover { background: var(--card-hover); }

.habit.done {
  border-color: rgba(0,184,148,0.5);
  background: linear-gradient(90deg, rgba(0,184,148,0.08), var(--card));
}

.habit-top {
  display: flex;
  align-items: center;
  gap: 14px;
}

.habit-info { flex: 1; min-width: 0; }

.habit-name {
  font-size: 16px;
  font-weight: 500;
  margin-bottom: 4px;
  word-break: break-word;
}

.habit.done .habit-name { color: var(--muted); }

.habit-meta {
  font-size: 13px;
  color: var(--muted);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

/* Счётчик */
.counter-block {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.counter-main {
  display: flex;
  align-items: stretch;
  gap: 10px;
  height: 54px;
}

.counter-minus {
  flex-shrink: 0;
  width: 48px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.03);
  color: var(--text);
  font-size: 22px;
  font-weight: 600;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: inherit;
  transition: all 0.15s;
  user-select: none;
}

.counter-minus:hover:not(:disabled) {
  background: rgba(255,107,107,0.12);
  border-color: rgba(255,107,107,0.4);
  color: var(--danger);
}

.counter-minus:active:not(:disabled) { transform: scale(0.94); }
.counter-minus:disabled { opacity: 0.25; cursor: not-allowed; }

.counter-display {
  flex: 1;
  position: relative;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: rgba(255,255,255,0.02);
  overflow: hidden;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

.counter-display:hover { border-color: var(--accent); }

.counter-display.complete {
  border-color: rgba(0,184,148,0.5);
  background: rgba(0,184,148,0.06);
}

.counter-display.pulse { animation: counterPulse 0.25s ease; }

@keyframes counterPulse {
  0% { transform: scale(1); }
  40% { transform: scale(0.96); }
  100% { transform: scale(1); }
}

.counter-bg {
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.03);
}

.counter-bg-fill {
  height: 100%;
  background: linear-gradient(90deg, rgba(108,92,231,0.35), rgba(162,155,254,0.35));
  transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.counter-display.complete .counter-bg-fill {
  background: linear-gradient(90deg, rgba(0,184,148,0.35), rgba(0,217,163,0.35));
}

.counter-text {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: baseline;
  gap: 4px;
  font-weight: 800;
  letter-spacing: -0.5px;
}

.counter-current {
  font-size: 26px;
  color: var(--text);
  transition: color 0.2s;
}

.counter-display.complete .counter-current { color: var(--success); }

.counter-sep {
  font-size: 20px;
  color: var(--muted);
  opacity: 0.6;
}

.counter-goal {
  font-size: 18px;
  color: var(--muted);

}

.counter-hint {

.counter-plus-group {

.counter-btn {
  border-radius: 12px;
  border: 1px solid var(--border);

  color: var(--text);
  font-family: inherit;
  font-weight: 700;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  user-select: none;
  padding: 4px 10px;
  min-width: 52px;
  font-size: 18px;
}

.counter-btn:hover:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
  color: white;
}

.counter-btn:active:not(:disabled) { transform: scale(0.94); }
.counter-btn:disabled { opacity: 0.25; cursor: not-allowed; }

.counter-btn.plus5 {
  background: rgba(255,159,67,0.12);
  border-color: rgba(255,159,67,0.3);
  color: #ff9f43;
}

.counter-btn.plus5:hover:not(:disabled) {
  background: #ff9f43;
  border-color: #ff9f43;

/* Модалка */
.counter-modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);

.counter-modal.active { display: flex; }

.counter-modal-box {

  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px;

.counter-modal-title {
  font-size: 14px;

.counter-modal-input {

  background: rgba(255,255,255,0.03);

.counter-modal-input::-webkit-outer-spin-button,
.counter-modal-input::-webkit-inner-spin-button {

.counter-modal-input:focus { border-color: var(--accent); }

.counter-modal-goal {

  padding: 16px;
  border-radius: 12px;
  border: 1px solid var(--border);

.counter-modal-buttons button:hover { background: rgba(255,255,255,0.05); }

.counter-modal-buttons button.primary {

.counter-modal-buttons button.primary:hover { background: var(--accent-2); }

.check-btn {

  width: 44px;
  height: 44px;
  border-radius: 12px;

  align-items: center;

}

.streak-widget {

.streak-widget.active {

@keyframes flicker {

}

.streak-count {

@media (max-width: 500px) {

}
</style>
</head>
<body>
<div class="container">
  <header>

          <span class="gs-number" id="gsNumber">0</span><span class="gs-unit" id="gsUnit">дней</span>
        </div>
        <div class="gs-status" id="gsStatus">Добавь привычки, чтобы начать</div>

    <div class="day-progress">

      </div>
      <div class="progress-bar">

<script>
var STORAGE_KEY = 'habit-tracker-v3';
var STATS_PERIOD_KEY = 'habit-tracker-stats-period';
var ACTIVE_TAB_KEY = 'habit-tracker-active-tab';

var state = loadState();
var statsDays = parseInt(localStorage.getItem(STATS_PERIOD_KEY) || '7', 10);
var activeTab = localStorage.getItem(ACTIVE_TAB_KEY) || 'today';
var editingHabitId = null;

function dateKey(d) {
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayKey() { return dateKey(new Date()); }
function yesterdayKey() {
  var d = new Date();
  d.setDate(d.getDate() - 1);
  return dateKey(d);
}
function shiftKey(key, days) {
  var parts = key.split('-').map(Number);
  var date = new Date(parts[0], parts[1] - 1, parts[2]);
  date.setDate(date.getDate() + days);
  return dateKey(date);
}
function weekdayIndex(key) {
  var parts = key.split('-').map(Number);
  var day = new Date(parts[0], parts[1] - 1, parts[2]).getDay();
  return (day + 6) % 7;
}
var WEEKDAYS_SHORT = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

function loadState() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  try {
    var old = localStorage.getItem('habit-tracker-v2');
    if (old) {
      var parsed = JSON.parse(old);
      parsed.habits.forEach(function(h) {
        if (h.goal === undefined) h.goal = 1;
        if (!h.progress) h.progress = {};
        if (h.completions && h.completions.length) {
          h.completions.forEach(function(d) {
            if (!h.progress[d]) h.progress[d] = 1;
          });
        }
      });
      return parsed;
    }
  } catch (e) {}
  return { habits: [], bestStreak: 0 };
}
function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function getProgress(habit, key) {
  if (!habit.progress) return 0;
  return habit.progress[key] || 0;
}
function getGoal(habit) {
  return habit.goal || 1;
}
function wasCompletedOn(habit, key) {
  return getProgress(habit, key) >= getGoal(habit);
}
function setProgress(habit, key, value) {
  if (!habit.progress) habit.progress = {};
  var goal = getGoal(habit);
  if (value <= 0) {
    delete habit.progress[key];
  } else if (value >= goal) {
    habit.progress[key] = goal;
  } else {
    habit.progress[key] = value;
  }
}

function vibrate(ms) {
  if (navigator.vibrate) {
    try { navigator.vibrate(ms); } catch (e) {}
  }
}

function pulseCounter(habitId) {
  var el = document.querySelector('[data-display-id="' + habitId + '"]');
  if (!el) return;
  el.classList.remove('pulse');
  void el.offsetWidth;
  el.classList.add('pulse');
}

function incrementHabit(id, amount) {
  amount = amount || 1;
  var habit = state.habits.find(function(h) { return h.id === id; });
  if (!habit) return;
  var today = todayKey();
  var current = getProgress(habit, today);
  var goal = getGoal(habit);
  if (current >= goal) return;
  var newValue = Math.min(goal, current + amount);
  if (newValue === current) return;
  setProgress(habit, today, newValue);
  saveState();
  vibrate(10);
  render();
  pulseCounter(id);
}

function decrementHabit(id) {
  var habit = state.habits.find(function(h) { return h.id === id; });
  if (!habit) return;
  var today = todayKey();
  var current = getProgress(habit, today);
  if (current <= 0) return;
  setProgress(habit, today, current - 1);
  saveState();
  vibrate(10);
  render();
}

function toggleHabit(id) {
  var habit = state.habits.find(function(h) { return h.id === id; });
  if (!habit) return;
  var today = todayKey();
  var current = getProgress(habit, today);
  var goal = getGoal(habit);
  if (current >= goal) {
    setProgress(habit, today, 0);
  } else {
    setProgress(habit, today, goal);
  }
  saveState();
  vibrate(15);
  render();
}

function isDoneToday(habit) {
  return wasCompletedOn(habit, todayKey());
}

function openCounterModal(habitId) {
  var habit = state.habits.find(function(h) { return h.id === habitId; });
  if (!habit) return;
  editingHabitId = habitId;
  var goal = getGoal(habit);
  var current = getProgress(habit, todayKey());
  var modal = document.getElementById('counterModal');
  var input = document.getElementById('counterModalInput');
  document.getElementById('counterModalGoal').textContent = 'Цель: ' + goal;
  input.value = current;
  input.max = goal;
  modal.classList.add('active');
  setTimeout(function() {
    input.focus();
    input.select();
  }, 100);
}

function closeCounterModal() {
  document.getElementById('counterModal').classList.remove('active');
  editingHabitId = null;
}

function saveCounterModal() {
  if (!editingHabitId) return;
  var habit = state.habits.find(function(h) { return h.id === editingHabitId; });
  if (!habit) { closeCounterModal(); return; }
  var input = document.getElementById('counterModalInput');
  var value = parseInt(input.value, 10) || 0;
  if (value < 0) value = 0;
  var goal = getGoal(habit);
  if (value > goal) value = goal;
  setProgress(habit, todayKey(), value);
  saveState();
  closeCounterModal();
  vibrate(15);
  render();
}

function isHabitRequiredOn(habit, key) {
  var from = habit.mustCompleteFrom || habit.createdAt || '0000-00-00';
  return from <= key;
}

function isDayComplete(key) {
  var required = state.habits.filter(function(h) { return isHabitRequiredOn(h, key); });
  if (required.length === 0) return false;
  return required.every(function(h) { return wasCompletedOn(h, key); });
}

function getGlobalStreak() {
  if (state.habits.length === 0) return 0;
  var today = todayKey();
  var yesterday = yesterdayKey();
  var cursor;
  if (isDayComplete(today)) cursor = today;
  else if (isDayComplete(yesterday)) cursor = yesterday;
  else return 0;

  var streak = 0;
  for (var i = 0; i < 3650; i++) {
    var required = state.habits.filter(function(h) { return isHabitRequiredOn(h, cursor); });
    if (required.length === 0) break;
    if (isDayComplete(cursor)) {
      streak++;
      cursor = shiftKey(cursor, -1);
    } else break;
  }
  return streak;
}

function updateBestStreak(current) {
  if (current > (state.bestStreak || 0)) {
    state.bestStreak = current;
    saveState();
  }
}

function getHabitStreak(habit) {
  var today = todayKey();
  var yesterday = yesterdayKey();
  var cursor;
  if (wasCompletedOn(habit, today)) cursor = today;
  else if (wasCompletedOn(habit, yesterday)) cursor = yesterday;
  else return 0;

  var streak = 0;
  for (var i = 0; i < 3650; i++) {
    if (wasCompletedOn(habit, cursor)) {
      streak++;
      cursor = shiftKey(cursor, -1);
    } else break;
  }
  return streak;
}

function isHabitRequiredToday(habit) {
  return isHabitRequiredOn(habit, todayKey());
}

function getPeriodKeys(days) {
  var keys = [];
  var today = todayKey();
  if (days === 0) {
    if (state.habits.length === 0) return [];
    var earliest = state.habits.map(function(h) { return h.createdAt || today; }).sort()[0];
    var cursor = earliest;
    var safety = 0;
    while (cursor <= today && safety < 730) {
      keys.push(cursor);
      cursor = shiftKey(cursor, 1);
      safety++;
    }
  } else {
    for (var i = days - 1; i >= 0; i--) {
      keys.push(shiftKey(today, -i));
    }
  }
  return keys;
}

function computeStats(days) {
  var keys = getPeriodKeys(days);
  if (keys.length === 0 || state.habits.length === 0) return null;

  var totalRequired = 0, totalDone = 0, completedDays = 0, trackedDays = 0;
  var byWeekday = [[], [], [], [], [], [], []];
  var perHabitMap = {};
  state.habits.forEach(function(h) { perHabitMap[h.id] = { name: h.name, done: 0, required: 0 }; });

  keys.forEach(function(key) {
    var requiredHabits = state.habits.filter(function(h) { return isHabitRequiredOn(h, key); });
    if (requiredHabits.length === 0) return;
    trackedDays++;
    var doneHabits = requiredHabits.filter(function(h) { return wasCompletedOn(h, key); });
    totalRequired += requiredHabits.length;
    totalDone += doneHabits.length;
    if (doneHabits.length === requiredHabits.length) completedDays++;
    byWeekday[weekdayIndex(key)].push(doneHabits.length / requiredHabits.length);
    requiredHabits.forEach(function(h) {
      var entry = perHabitMap[h.id];
      if (!entry) return;
      entry.required++;
      if (wasCompletedOn(h, key)) entry.done++;
    });
  });

  var completionRate = totalRequired > 0 ? Math.round((totalDone / totalRequired) * 100) : 0;
  var dayRate = trackedDays > 0 ? Math.round((completedDays / trackedDays) * 100) : 0;
  var weekdayAvg = byWeekday.map(function(arr) {
    if (arr.length === 0) return 0;
    return Math.round((arr.reduce(function(a,b) { return a+b; }, 0) / arr.length) * 100);
  });

  var bestWeekdayIdx = -1, bestWeekdayVal = -1;
  weekdayAvg.forEach(function(v, i) {
    if (byWeekday[i].length > 0 && v > bestWeekdayVal) {
      bestWeekdayVal = v;
      bestWeekdayIdx = i;
    }
  });

  var longestStreak = 0, currentRun = 0;
  keys.forEach(function(key) {
    var requiredHabits = state.habits.filter(function(h) { return isHabitRequiredOn(h, key); });
    if (requiredHabits.length === 0) return;
    var complete = requiredHabits.every(function(h) { return wasCompletedOn(h, key); });
    if (complete) {
      currentRun++;
      if (currentRun > longestStreak) longestStreak = currentRun;
    } else currentRun = 0;
  });

  var perHabit = Object.keys(perHabitMap).map(function(k) { return perHabitMap[k]; })
    .filter(function(e) { return e.required > 0; })
    .map(function(e) {
      return { name: e.name, percent: Math.round((e.done / e.required) * 100), done: e.done, required: e.required };
    })
    .sort(function(a, b) { return b.percent - a.percent; });

  return { completionRate, dayRate, completedDays, trackedDays, longestStreak, weekdayAvg, byWeekday, bestWeekdayIdx, bestWeekdayVal, perHabit };
}

function renderStats() {
  var container = document.getElementById('statsContent');
  if (state.habits.length === 0) {
    container.innerHTML = '<div class="stats-empty">📊 Статистика появится, когда начнёшь отмечать привычки</div>';
    return;
  }
  var s = computeStats(statsDays);
  if (!s) {
    container.innerHTML = '<div class="stats-empty">Пока нет данных за выбранный период</div>';
    return;
  }
  var rateClass = s.completionRate >= 80 ? 'success' : s.completionRate >= 50 ? 'accent' : 'warn';
  var maxWeekday = Math.max.apply(null, s.weekdayAvg.concat([1]));
  var barsHtml = s.weekdayAvg.map(function(val, i) {
    var heightPct = (val / maxWeekday) * 100;
    var isBest = i === s.bestWeekdayIdx && val > 0;
    var hasData = s.byWeekday[i].length > 0;
    return '<div class="week-bar-wrap">' +
      '<div class="week-bar ' + (isBest ? 'best' : '') + '" style="height: ' + (hasData ? Math.max(heightPct, 3) : 0) + '%">' +
        (hasData ? '<span class="week-bar-value">' + val + '%</span>' : '') +
      '</div></div>';
  }).join('');

  var labelsHtml = WEEKDAYS_SHORT.map(function(d) { return '<div>' + d + '</div>'; }).join('');

  var perHabitHtml = s.perHabit.map(function(h) {
    var cls = h.percent >= 80 ? '' : h.percent >= 50 ? 'mid' : 'low';
    return '<div class="ph-row">' +
      '<div class="ph-head">' +
        '<div class="ph-name">' + escapeHtml(h.name) + '</div>' +
        '<div class="ph-value">' + h.percent + '% · ' + h.done + '/' + h.required + '</div>' +
      '</div>' +
      '<div class="ph-bar"><div class="ph-fill ' + cls + '" style="width: ' + h.percent + '%"></div></div>' +
    '</div>';
  }).join('');

  container.innerHTML =
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-value ' + rateClass + '">' + s.completionRate + '%</div><div class="stat-label">Выполнено</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + s.dayRate + '%</div><div class="stat-label">Полных дней</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + s.completedDays + '</div><div class="stat-label">Дней закрыто</div></div>' +
      '<div class="stat-card"><div class="stat-value warn">' + s.longestStreak + '</div><div class="stat-label">Лучший стрик</div></div>' +
    '</div>' +
    '<div class="week-chart">' +
      '<div class="week-chart-title">По дням недели' + (s.bestWeekdayIdx >= 0 && s.bestWeekdayVal > 0 ? ' · лучший: ' + WEEKDAYS_SHORT[s.bestWeekdayIdx] + ' (' + s.bestWeekdayVal + '%)' : '') + '</div>' +
      '<div class="week-bars">' + barsHtml + '</div>' +
      '<div class="week-labels">' + labelsHtml + '</div>' +
    '</div>' +
    '<div class="per-habit">' +
      '<div class="per-habit-title">По привычкам</div>' +
      perHabitHtml +
    '</div>';
}

function deleteHabit(id) {
  if (!confirm('Удалить привычку?')) return;
  state.habits = state.habits.filter(function(h) { return h.id !== id; });
  saveState();
  render();
}

function addHabit(name, goal) {
  var today = todayKey();
  var requiredToday = state.habits.filter(function(h) { return isHabitRequiredToday(h); });
  var dayClosedBefore = requiredToday.length > 0 && requiredToday.every(function(h) { return wasCompletedOn(h, today); });
  var mustCompleteFrom = dayClosedBefore ? shiftKey(today, 1) : today;
  state.habits.push({
    id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    name: name.trim(),
    goal: goal || 1,
    progress: {},
    createdAt: today,
    mustCompleteFrom: mustCompleteFrom
  });
  saveState();
  render();
}

function switchTab(tab) {
  activeTab = tab;
  localStorage.setItem(ACTIVE_TAB_KEY, tab);
  document.querySelectorAll('.tab-panel').forEach(function(p) {
    p.classList.toggle('active', p.id === 'tab-' + tab);
  });
  document.querySelectorAll('.nav-btn').forEach(function(b) {
    b.classList.toggle('active', b.dataset.tab === tab);
  });
  document.getElementById('pageTitle').textContent = tab === 'stats' ? '📊 Статистика' : '🔥 Трекер привычек';
  if (tab === 'stats') renderStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  var list = document.getElementById('habitsList');
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString('ru-RU', {
    day: 'numeric', month: 'long', weekday: 'short'
  });

  var globalStreak = getGlobalStreak();
  updateBestStreak(globalStreak);

  var gsEl = document.getElementById('globalStreak');
  document.getElementById('gsNumber').textContent = globalStreak;
  document.getElementById('gsUnit').textContent = pluralDays(globalStreak);
  document.getElementById('gsBest').textContent = 'Рекорд: ' + (state.bestStreak || 0);

  gsEl.classList.remove('active', 'at-risk');

  var requiredToday = state.habits.filter(isHabitRequiredToday);
  var doneToday = requiredToday.filter(isDoneToday).length;
  var totalToday = requiredToday.length;
  var gsStatus = document.getElementById('gsStatus');

  if (state.habits.length === 0) {
    gsStatus.textContent = 'Добавь привычки, чтобы начать';
    gsStatus.className = 'gs-status';
  } else {
    var allDone = totalToday > 0 && doneToday === totalToday;
    if (allDone && globalStreak > 0) {
      gsEl.classList.add('active');
      gsStatus.textContent = '🎉 Все выполнено! Стрик продолжается';
      gsStatus.className = 'gs-status';
    } else if (globalStreak > 0) {
      gsEl.classList.add('at-risk');
      gsStatus.textContent = '⚠️ Осталось ' + (totalToday - doneToday) + ' — не разорви цепочку!';
      gsStatus.className = 'gs-status warn';
    } else {
      var wasYesterday = isDayComplete(yesterdayKey());
      if (wasYesterday) {
        gsStatus.textContent = 'Выполни все сегодня, чтобы продлить стрик';
        gsStatus.className = 'gs-status warn';
      } else {
        gsStatus.textContent = allDone ? '🎉 Отличное начало! Стрик пошёл' : 'Выполни все привычки, чтобы начать стрик';
        gsStatus.className = 'gs-status';
      }
      if (allDone) gsEl.classList.add('active');
    }
  }

  document.getElementById('progressText').textContent = doneToday + ' / ' + totalToday;
  document.getElementById('progressFill').style.width = totalToday === 0 ? '0%' : ((doneToday / totalToday) * 100) + '%';

  if (state.habits.length === 0) {
    list.innerHTML = '<div class="empty"><div class="empty-icon">🌱</div><p>Пока нет привычек.<br>Добавь первую — и общий стрик начнёт расти,<br>когда выполнишь всё за день!</p></div>';
  } else {
    list.innerHTML = state.habits.map(function(habit) {
      var done = isDoneToday(habit);
      var streak = getHabitStreak(habit);
      var goal = getGoal(habit);
      var hasCounter = goal > 1;
      var current = getProgress(habit, todayKey());
      var required = isHabitRequiredToday(habit);
      var startsTomorrow = !required && habit.mustCompleteFrom === shiftKey(todayKey(), 1);

      var topControl;
      if (hasCounter) {
        var remaining = goal - current;
        topControl =
          '<div style="flex-shrink:0; text-align:center; padding:8px 12px; border-radius:12px; background:rgba(255,255,255,0.03); border:1px solid var(--border); min-width:70px;">' +
            '<div style="font-size:18px; font-weight:800; color:' + (done ? 'var(--success)' : 'var(--text)') + '; line-height:1;">' + current + '<span style="color:var(--muted); font-size:13px;">/' + goal + '</span></div>' +
            '<div style="font-size:9px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-top:2px;">' + (done ? 'готово' : 'осталось ' + remaining) + '</div>' +
          '</div>';
      } else {
        topControl = '<button class="check-btn" data-action="toggle" title="' + (done ? 'Отменить' : 'Отметить') + '">✓</button>';
      }

      var counterHtml = '';
      if (hasCounter) {
        var percentFill = Math.min(100, (current / goal) * 100);
        var remaining = goal - current;
        var canPlus5 = remaining >= 5;
        var hintText = done ? '✓ выполнено' : 'нажми на полосу';
        counterHtml =
          '<div class="counter-block">' +
            '<div class="counter-main">' +
              '<button class="counter-minus" data-action="minus" ' + (current === 0 ? 'disabled' : '') + ' title="−1">−</button>' +
              '<div class="counter-display ' + (done ? 'complete' : '') + '" data-action="edit" data-display-id="' + habit.id + '" title="Нажми, чтобы ввести вручную">' +
                '<div class="counter-bg"><div class="counter-bg-fill" style="width:' + percentFill + '%"></div></div>' +
                '<div class="counter-text">' +
                  '<span class="counter-current">' + current + '</span>' +
                  '<span class="counter-sep">/</span>' +
                  '<span class="counter-goal">' + goal + '</span>' +
                '</div>' +
                '<div class="counter-hint">' + hintText + '</div>' +
              '</div>' +
              '<div class="counter-plus-group">' +
                '<button class="counter-btn" data-action="plus" ' + (done ? 'disabled' : '') + ' title="+1">+1</button>' +
                '<button class="counter-btn plus5" data-action="plus5" ' + (!canPlus5 ? 'disabled' : '') + ' title="+5">+5</button>' +
              '</div>' +
            '</div>' +
          '</div>';
      }

      return '<div class="habit ' + (done ? 'done' : '') + '" data-id="' + habit.id + '">' +
        '<div class="habit-top">' +
          topControl +
          '<div class="habit-info">' +
            '<div class="habit-name">' + escapeHtml(habit.name) + '</div>' +
            '<div class="habit-meta">' +
              (startsTomorrow ? '<span style="color:#6c5ce7">✨ со след. дня в стрике</span>' : '') +
              (hasCounter ? '<span>🎯 цель: ' + goal + ' раз</span>' : '') +
              (streak > 0 ? '<span>🔥 ' + streak + ' ' + pluralDays(streak) + ' подряд</span>' : '') +
            '</div>' +
          '</div>' +
          '<div class="streak-widget ' + (streak > 0 ? 'active' : '') + '">' +
            '<div class="streak-flame">🔥</div>' +
            '<div class="streak-count">' + streak + '</div>' +
            '<div class="streak-label">дней</div>' +
          '</div>' +
          '<button class="delete-btn" data-action="delete" title="Удалить">✕</button>' +
        '</div>' +
        counterHtml +
      '</div>';
    }).join('');
  }

  if (activeTab === 'stats') renderStats();
}

function pluralDays(n) {
  var mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return 'день';
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'дня';
  return 'дней';
}

function escapeHtml(str) {
  return str.replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

// ============ СОБЫТИЯ ФОРМЫ ============

// Обновление подписи под переключателем
function updateToggleSub() {
  var on = document.getElementById('counterToggle').checked;
  document.getElementById('toggleSub').textContent = on
    ? 'Считать количество повторений'
    : 'Сделал / не сделал';
}

// Клик по всей строке переключателя — включает/выключает
document.getElementById('counterToggleRow').addEventListener('click', function(e) {
  var checkbox = document.getElementById('counterToggle');
  // Если клик не по самому чекбоксу — переключаем
  if (e.target !== checkbox) {
    checkbox.checked = !checkbox.checked;
  }
  // Обновляем визуал
  this.classList.toggle('active', checkbox.checked);
  document.getElementById('goalBlock').classList.toggle('active', checkbox.checked);
  updateToggleSub();
  if (checkbox.checked) {
    setTimeout(function() {
      document.getElementById('goalInput').focus();
      document.getElementById('goalInput').select();
    }, 200);
  }
});

// Кнопки − и + у цели
document.getElementById('goalMinus').addEventListener('click', function() {
  var input = document.getElementById('goalInput');
  var v = parseInt(input.value, 10) || 1;
  if (v > 1) input.value = v - 1;
  syncPresets();
});
document.getElementById('goalPlus').addEventListener('click', function() {
  var input = document.getElementById('goalInput');
  var v = parseInt(input.value, 10) || 0;
  if (v < 9999) input.value = v + 1;
  syncPresets();
});

// Ручной ввод цели — обновляем пресеты
document.getElementById('goalInput').addEventListener('input', syncPresets);

function syncPresets() {
  var v = parseInt(document.getElementById('goalInput').value, 10);
  document.querySelectorAll('#goalPresets button').forEach(function(b) {
    b.classList.toggle('active', parseInt(b.dataset.preset, 10) === v);
  });
}

// Пресеты
document.getElementById('goalPresets').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  document.getElementById('goalInput').value = btn.dataset.preset;
  syncPresets();
  vibrate(10);
});

// Отправка формы
document.getElementById('addForm').addEventListener('submit', function(e) {
  e.preventDefault();
  var input = document.getElementById('habitInput');
  var value = input.value.trim();
  if (!value) return;
  var useCounter = document.getElementById('counterToggle').checked;
  var goal = 1;
  if (useCounter) {
    goal = parseInt(document.getElementById('goalInput').value, 10) || 1;
    if (goal < 1) goal = 1;
    if (goal > 9999) goal = 9999;
  }
  addHabit(value, goal);
  input.value = '';
  document.getElementById('counterToggle').checked = false;
  document.getElementById('counterToggleRow').classList.remove('active');
  document.getElementById('goalBlock').classList.remove('active');
  document.getElementById('goalInput').value = '10';
  syncPresets();
  updateToggleSub();
  input.focus();
});

// Делегирование клика по привычкам
document.getElementById('habitsList').addEventListener('click', function(e) {
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var habitEl = el.closest('.habit');
  if (!habitEl) return;
  var id = habitEl.dataset.id;
  var action = el.dataset.action;
  if (action === 'toggle') toggleHabit(id);
  if (action === 'delete') deleteHabit(id);
  if (action === 'plus') incrementHabit(id, 1);
  if (action === 'plus5') incrementHabit(id, 5);
  if (action === 'minus') decrementHabit(id);
  if (action === 'edit') openCounterModal(id);
});

document.getElementById('counterModalCancel').addEventListener('click', closeCounterModal);
document.getElementById('counterModalSave').addEventListener('click', saveCounterModal);
document.getElementById('counterModal').addEventListener('click', function(e) {
  if (e.target.id === 'counterModal') closeCounterModal();
});
document.getElementById('counterModalInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') saveCounterModal();
  if (e.key === 'Escape') closeCounterModal();
});

document.getElementById('statsPeriod').addEventListener('click', function(e) {
  var btn = e.target.closest('button');
  if (!btn) return;
  statsDays = parseInt(btn.dataset.days, 10);
  localStorage.setItem(STATS_PERIOD_KEY, String(statsDays));
  document.querySelectorAll('#statsPeriod button').forEach(function(b) {
    b.classList.toggle('active', b === btn);
  });
  renderStats();
});

document.querySelector('.bottom-nav').addEventListener('click', function(e) {
  var btn = e.target.closest('.nav-btn');
  if (!btn) return;
  switchTab(btn.dataset.tab);
});

document.querySelectorAll('#statsPeriod button').forEach(function(b) {
  b.classList.toggle('active', parseInt(b.dataset.days, 10) === statsDays);
});

var lastDay = todayKey();
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && todayKey() !== lastDay) {
    lastDay = todayKey();
    render();
  }
});

render();
switchTab(activeTab);
</script>
